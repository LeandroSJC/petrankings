services:
  # ==============================================================================
  # 1. Reverse Proxy Caddy (Roteador de Tráfego HTTP e Subdomínios)
  # ==============================================================================
  caddy:
    image: caddy:2-alpine
    container_name: petrankings-caddy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - app
      - umami
      - uptime-kuma
    networks:
      - petrankings-net

  # ==============================================================================
  # 2. Banco de Dados PostgreSQL 16
  # ==============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: petrankings-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-petrankings}
      POSTGRES_USER: ${POSTGRES_USER:-petrankings}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-petrankings_secure_pass_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-petrankings} -d ${POSTGRES_DB:-petrankings}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - petrankings-net

  # ==============================================================================
  # 3. Portal PetRankings (Next.js 15 Standalone)
  # ==============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: petrankings-app
    restart: always
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=postgresql://${POSTGRES_USER:-petrankings}:${POSTGRES_PASSWORD:-petrankings_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-petrankings}?schema=public
      - DIRECT_URL=postgresql://${POSTGRES_USER:-petrankings}:${POSTGRES_PASSWORD:-petrankings_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-petrankings}?schema=public
      - JWT_SECRET=${JWT_SECRET:-petrankings_jwt_secret_min_32_chars_long_2026}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://petrankings.com.br}
      - ALLOW_ADMIN_IN_PRODUCTION=${ALLOW_ADMIN_IN_PRODUCTION:-true}
      - ADMIN_SECRET_GATE_PATH=${ADMIN_SECRET_GATE_PATH:-/bastidores}
      - ADMIN_GATE_KEY=${ADMIN_GATE_KEY:-petrankings_gate_secret_key_2026}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-PetRankings <onboarding@resend.dev>}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./public/uploads:/app/public/uploads
    networks:
      - petrankings-net

  # ==============================================================================
  # 4. Umami Analytics (Privativo, Sem Cookies, Imune a AdBlock)
  # ==============================================================================
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: petrankings-umami
    restart: always
    expose:
      - "3000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-petrankings}:${POSTGRES_PASSWORD:-petrankings_secure_pass_2026}@postgres:5432/umami
      - APP_SECRET=${UMAMI_SECRET:-petrankings_umami_secret_salt_2026_super_safe}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - petrankings-net

  # ==============================================================================
  # 5. Uptime Kuma (Monitoramento 24/7 com Alerta em Tempo Real)
  # ==============================================================================
  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: petrankings-uptime
    restart: always
    expose:
      - "3001"
    volumes:
      - uptime_kuma_data:/app/data
    networks:
      - petrankings-net

volumes:
  postgres_data:
  uptime_kuma_data:

networks:
  petrankings-net:
    driver: bridge
