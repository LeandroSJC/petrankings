x-logging: &default-logging
  logging:
    driver: "json-file"
    options:
      max-size: "50m"
      max-file: "3"

services:
  # ==============================================================================
  # 1. Reverse Proxy Caddy (Roteador de Tráfego HTTP e Subdomínios)
  # ==============================================================================
  caddy:
    <<: *default-logging
    image: caddy:2-alpine
    container_name: petrankings-caddy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./public/uploads:/var/www/uploads:ro
    depends_on:
      - app
      - umami
      - uptime-kuma
    networks:
      - petrankings-net

  # ==============================================================================
  # 2. Banco de Dados PostgreSQL 16 (Otimizado para ARM 12GB RAM)
  # ==============================================================================
  postgres:
    <<: *default-logging
    image: postgres:16-alpine
    container_name: petrankings-postgres
    restart: always
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=2GB"
      - "-c"
      - "effective_cache_size=6GB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=512MB"
      - "-c"
      - "min_wal_size=1GB"
      - "-c"
      - "max_wal_size=4GB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "default_statistics_target=100"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "max_worker_processes=2"
      - "-c"
      - "max_parallel_workers_per_gather=1"
      - "-c"
      - "max_parallel_workers=2"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-petrankings}
      POSTGRES_USER: ${POSTGRES_USER:-petrankings}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-petrankings} -d ${POSTGRES_DB:-petrankings}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - petrankings-net

  # ==============================================================================
  # 3. Portal PetRankings (Next.js 15 Standalone)
  # ==============================================================================
  app:
    <<: *default-logging
    build:
      context: .
      dockerfile: Dockerfile
    container_name: petrankings-app
    restart: always
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-petrankings}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-petrankings}?schema=public}
      - DIRECT_URL=${DIRECT_URL:-postgresql://${POSTGRES_USER:-petrankings}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-petrankings}?schema=public}
      - JWT_SECRET=${JWT_SECRET}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://petrankings.com.br}
      - ALLOW_ADMIN_IN_PRODUCTION=${ALLOW_ADMIN_IN_PRODUCTION:-true}
      - ADMIN_SECRET_GATE_PATH=${ADMIN_SECRET_GATE_PATH:-/bastidores}
      - ADMIN_GATE_KEY=${ADMIN_GATE_KEY}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-PetRankings <onboarding@resend.dev>}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./public/uploads:/app/public/uploads
    networks:
      - petrankings-net

  # ==============================================================================
  # 4. Umami Analytics (Privativo, Sem Cookies, Imune a AdBlock)
  # ==============================================================================
  umami:
    <<: *default-logging
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: petrankings-umami
    restart: always
    expose:
      - "3000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-petrankings}:${POSTGRES_PASSWORD}@postgres:5432/umami
      - APP_SECRET=${UMAMI_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - petrankings-net

  # ==============================================================================
  # 5. Uptime Kuma (Monitoramento 24/7 com Alerta em Tempo Real)
  # ==============================================================================
  uptime-kuma:
    <<: *default-logging
    image: louislam/uptime-kuma:2
    container_name: petrankings-uptime
    restart: always
    expose:
      - "3001"
    volumes:
      - uptime_kuma_data:/app/data
    networks:
      - petrankings-net

volumes:
  postgres_data:
  uptime_kuma_data:

networks:
  petrankings-net:
    driver: bridge
